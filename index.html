const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(pw){
  const key=await keyFrom(pw);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA)));
  // the song is encrypted too; decrypt it into a private in-memory file
  let songUrl='';
  try{
    const enc=await (await fetch('song.bin',{cache:'force-cache'})).arrayBuffer();
    const mp3=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SONG_IV)},key,enc);
    songUrl=URL.createObjectURL(new Blob([mp3],{type:'audio/mpeg'}));
  }catch(e){}
  return html.replace('src="song.mp3#t=48"', songUrl ? 'src="'+songUrl+'"' : '');
}
function show(html){ document.open(); document.write(html); document.close(); }
const f=document.getElementById('f'), pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err'), box=document.getElementById('box');
f.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
  try{
    const html=await unlock(pw.value);
    try{ localStorage.setItem('bpp2',pw.value); }catch(_e){}
    show(html);
  }catch(_e){
    go.disabled=false; go.textContent='Unlock'; err.textContent='Wrong password';
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); pw.select();
  }
});
// remember on this device so she doesn't have to type it every time
(async()=>{ let saved=null; try{ saved=localStorage.getItem('bpp2'); }catch(_e){}
  if(saved){ try{ show(await unlock(saved)); }catch(_e){ try{ localStorage.removeItem('bpp2'); }catch(__e){} } } })();
pw.focus();
